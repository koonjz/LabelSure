version: '3.9'

services:
  # ─────────────────────────────────────────────
  # PostgreSQL Database
  # ─────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: labelsure_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: labelsure
      POSTGRES_USER: labelsure
      POSTGRES_PASSWORD: labelsure
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labelsure"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # FastAPI Backend
  # ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: labelsure_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://labelsure:labelsure@db:5432/labelsure
      SYNC_DATABASE_URL: postgresql://labelsure:labelsure@db:5432/labelsure
      SECRET_KEY: ${SECRET_KEY:-changeme-in-production}
      UPLOAD_DIR: /app/uploads
      DEBUG: "false"
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads

volumes:
  postgres_data:
  uploads_data:

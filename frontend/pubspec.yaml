name: labelsure
description: AI-powered Legal Metrology compliance scanner for India PCR 2011.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP
  dio: ^5.7.0

  # Image capture & compression
  image_picker: ^1.1.2
  camera: ^0.11.0+2
  flutter_image_compress: ^2.3.0   # Compress JPEG before upload (native speed)

  # On-device OCR (Google ML Kit) — no backend needed for OCR!
  # Models (~8MB each) are downloaded once from Google and cached on-device.
  # Supports: English, Hindi (Devanagari), Tamil, Telugu, Kannada, Malayalam.
  google_mlkit_text_recognition: ^0.13.0

  # Secure storage for JWT token
  flutter_secure_storage: ^9.2.2

  # State management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.2.7

  # UI
  cupertino_icons: ^1.0.8
  flutter_animate: ^4.5.0
  cached_network_image: ^3.4.1
  percent_indicator: ^4.2.3

  # Utilities
  intl: ^0.19.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

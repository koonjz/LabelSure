// LabelSure — Android app-level build.gradle
plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// ─── Signing key configuration ────────────────────────────────────────────────
// Reads from android/key.properties (NOT committed to git).
// For local dev, release builds fall back to the debug keystore.
// For CI/CD and production, set these via environment variables instead:
//   KEYSTORE_FILE, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
// See DEPLOYMENT.md → "Android Signing" for full instructions.
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
def hasKeystoreFile = keystorePropertiesFile.exists()
if (hasKeystoreFile) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

android {
    namespace "com.labelsure.app"
    compileSdkVersion 36
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.labelsure.app"

        // minSdk 21: satisfies image_picker, camera, flutter_secure_storage
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 34

        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    // ─── Signing configs ──────────────────────────────────────────────────────
    signingConfigs {
        debug {
            // Uses the default Android debug keystore (~/.android/debug.keystore)
            // No configuration needed — Android Studio handles this automatically.
        }

        release {
            if (hasKeystoreFile) {
                // Local signing via key.properties (for direct APK distribution)
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            } else if (System.env.KEYSTORE_FILE) {
                // CI/CD signing via environment variables (e.g. GitHub Actions)
                keyAlias System.env.KEY_ALIAS
                keyPassword System.env.KEY_PASSWORD
                storeFile file(System.env.KEYSTORE_FILE)
                storePassword System.env.KEYSTORE_PASSWORD
            } else {
                // Fallback: use debug keystore credentials directly (AGP 8.6+ compatible)
                // ⚠️  Only suitable for sideloading/hackathon demo — not Play Store.
                keyAlias "AndroidDebugKey"
                keyPassword "android"
                storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
                storePassword "android"
            }
        }
    }

    // ─── Build types ──────────────────────────────────────────────────────────
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            debuggable true
            // API_BASE_URL defaults to emulator host in app_config.dart — no override needed.
        }

        release {
            // Uses release signingConfig above; falls back to debug keystore if no key.properties.
            signingConfig signingConfigs.release
            minifyEnabled true        // Enable R8 code shrinking
            shrinkResources true      // Remove unused resources
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // ⚠️  API_BASE_URL MUST be passed at build time via --dart-define.
            // Example:
            //   flutter build apk --release \
            //     --dart-define=API_BASE_URL=https://api.labelsure.app
        }
    }

    buildFeatures {
        buildConfig true
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.1.0"
}
